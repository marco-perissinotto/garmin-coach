<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stato di forma</title>
<style>

    --run: #3987e5; --bike: #d95926; --swim: #199e70; --other: #5f5e5a; --deemph: #5f5e5a; --accent: #3987e5;
    --low: #184f95; --mid: #3987e5; --high: #9ec5f4; --goodtext: #0ca30c;

  }
}

  color-scheme: dark;

  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --hover: rgba(255,255,255,.05);

.plan-day:first-child { border-top: 0; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; }
.warnbar { background: var(--surface); border: 1px solid var(--warning); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; font-size: 14px; }
footer { margin-top: 48px; color: var(--muted); font-size: 13px; max-width: 80ch; }
@media (max-width: 560px) { .hero-fig { font-size: 52px; } h1 { font-size: 24px; } .card { padding: 14px; } }
@media print { .controls, .ins .acts, .btn { display: none !important; } body { background: #fff; } }

<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const SVGNS = "http://www.w3.org/2000/svg";

const pctf = (v, nd = 0) => v == null ? "–" : nf(v * 100, nd) + "%";

}
const pace = s => s ? hms(s) + "/km" : "–";
const dm = iso => { if (!iso) return "–"; const p = iso.split("-"); return `${+p[2]}/${+p[1]}`; };

const rangeStart = () => addDays(D.today, -(state.range - 1));

  const out = []; let q = [];
  for (let i = 0; i < vals.length; i++) {

function niceTicks(lo, hi, n) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / Math.max(n, 1), mag = Math.pow(10, Math.floor(Math.log10(raw)));

// -- chart container: caption, legend, table view ---------------------------------------------------------------
function figure(title, desc, opts) {
  const body = el("div", { class: "chart" });

    el("figcaption", null, el("div", null, el("div", { class: "title", text: title }), desc ? el("div", { class: "desc", text: desc }) : null), tbtn),

  state.redraw.push(run);
  requestAnimationFrame(run);

// -- line chart (dates or numbers on x) ---------------------------------------------------------------------------
// series: {name, color, kind: line|points|band|area|diverge, values, lo, hi, width, fmt, emph, endLabel}
function lineChart(fig, cfg) {
  const host = fig._body, W = Math.max(host.clientWidth, 260), H = cfg.height || 220;

  const xs = cfg.x.map(v => cfg.numeric ? v : ms(v));

  const padv = (hi - lo) * 0.08 || 1, dataLo = lo; lo -= padv; hi += padv;

  lo = ticks[0]; hi = ticks[ticks.length - 1];
  const x0 = xs[0], x1 = xs[xs.length - 1] === x0 ? x0 + 1 : xs[xs.length - 1];
  const X = v => m.l + (v - x0) / (x1 - x0) * pw;

    g.append(sv("line", { x1: m.l, x2: m.l + pw, y1: Y(t), y2: Y(t), style: `stroke:var(${t === 0 && cfg.zero ? "--axis" : "--grid"});stroke-width:1` }));
    g.append(sv("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end", text: (cfg.yFmt || nf)(t) }));

  const xt = cfg.numeric ? niceTicks(x0, x1, Math.max(2, Math.floor(pw / 80))).filter(v => v >= x0 && v <= x1).map(v => [v, (cfg.xFmt || nf)(v)]) : dateTicks(x0, x1, pw);

  if (sl) sc.append(kv([["Ultime 7 notti", nf(sl.avg_7, 1) + " h", `fabbisogno ${nf(sl.need, 1)} h · 4 settimane ${nf(sl.avg_28, 1)} h`, sl.avg_7 < sl.need - 0.3 ? "dn" : null],
    ["Bilancio 14 notti", sl.debt_14_h > 0 ? `−${nf(sl.debt_14_h, 1)} h` : `+${nf(-sl.debt_14_h, 1)} h`, sl.debt_14_h > 0 ? "sotto il fabbisogno" : "sopra il fabbisogno", sl.debt_14_h >= 4 ? "dn" : null],
    ["A letto", sl.bedtime, `±${nf(sl.bedtime_sd_min)} min nelle ultime 4 settimane`, sl.bedtime_sd_min >= 45 ? "dn" : null], ["Sveglia", sl.wake, `±${nf(sl.wake_sd_min)} min`]]));
  const fs = figure("Ore di sonno", "Media di 7 notti contro il fabbisogno stimato da Garmin");
  legend(fs, [["Sonno (media 7 notti)", "var(--accent)"], ["Fabbisogno", "var(--muted)"]]);
  mount(fs, () => { const d = sliceDaily(["sleep_h", "need_h", "sleep_score", "deep_rem"]); lineChart(fs, { x: d.x, series: [{ name: "Fabbisogno", color: "var(--muted)", values: roll(d.need_h, 7, 4), width: 1.5, fmt: v => nf(v, 1) + " h" }, { name: "Sonno (media 7 notti)", color: "var(--accent)", values: roll(d.sleep_h, 7, 4), fmt: v => nf(v, 1) + " h" }], yFmt: v => nf(v, 1), height: 180, aria: "Ore di sonno" });
    tableView(fs, ["Notte", "Ore", "Fabbisogno", "Punteggio", "Profondo+REM"], () => d.x.map((x, i) => [dmy(x), nf(d.sleep_h[i], 1), nf(d.need_h[i], 1), nf(d.sleep_score[i]), d.deep_rem[i] == null ? "" : nf(d.deep_rem[i]) + "%"]).reverse()); });
  sc.append(fs);
  const wd = (D.patterns || {}).sleep_by_weekday;
  if (wd) {
    const names = ["dom→lun", "lun→mar", "mar→mer", "mer→gio", "gio→ven", "ven→sab", "sab→dom"], mx = Math.max(...wd);
    sc.append(el("h3", { style: "margin-top:14px", text: "Ore di sonno per notte della settimana (6 mesi)" }),
      el("div", null, wd.map((v, i) => el("div", { style: "display:grid;grid-template-columns:72px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:3px 0" },
        el("span", { class: "sub", text: names[i] }), el("div", { class: "meter" }, el("i", { style: `width:${(v / mx * 100).toFixed(1)}%;background:${v === Math.min(...wd) ? "var(--accent)" : "var(--deemph)"}` })), el("span", { class: "num", text: nf(v, 1) + " h" })))));
  }
  sec.append(el("div", { style: "margin-top:16px" }, sc));
})();

// plan + events
(function planSection() {
  const sec = sectionHead("plan", "Piano concordato e prossime gare", "Il piano è quello concordato nella chat con il coach (coaching-state.yaml).");
  app.append(sec);
  const st = D.state, meta = D.state_meta || {}, card = el("div", { class: "card" });
  if (!st) card.append(el("p", { class: "muted", text: "Nessun piano registrato: chiedi al coach «/coach plan»." }));
  else {
    if (meta.stale) card.append(el("div", { class: "warnbar", text: `Piano vecchio di ${meta.age_days} giorni: confermalo con il coach.` }));
    const plan = st.plan || {};
    card.append(el("h3", { text: plan.from ? `Dal ${dmy(plan.from)}${plan.to ? " al " + dmy(plan.to) : ""}` : "Piano" }));
    card.append(el("div", null, (plan.days || []).map(p => el("div", { class: "plan-day" + (p.date === D.today ? " today" : p.date < D.today ? " past" : "") },
      el("span", { class: "when", text: (p.date === D.today ? "oggi " : "") + dm(p.date) }), el("span", { text: p.session })))));
    if ((plan.change_if || []).length) card.append(el("h3", { style: "margin-top:12px", text: "Cambia il piano se" }), el("ul", { style: "margin:0;padding-left:18px;font-size:14px" }, plan.change_if.map(c => el("li", { text: c }))));
    const dec = st.decisions || {};
    if ((dec.open || []).length) card.append(el("h3", { style: "margin-top:12px", text: "Decisioni aperte" }), el("ul", { style: "margin:0;padding-left:18px;font-size:14px" }, dec.open.map(o => el("li", { text: o.question + (o.decide_by ? ` (entro il ${dm(o.decide_by)})` : "") }))));
    if ((st.symptoms || []).length) card.append(el("h3", { style: "margin-top:12px", text: "Sintomi segnalati" }), el("ul", { style: "margin:0;padding-left:18px;font-size:14px" }, st.symptoms.map(s => el("li", { text: s.text + (s.since ? ` (dal ${dm(s.since)})` : "") }))));
  }
  const ev = el("div", { class: "card" }, el("h3", { text: "Prossime gare" }));
  if (!D.events.length) ev.append(el("p", { class: "muted", text: "Nessuna gara in events.yaml." }));
  else ev.append(el("div", { class: "tbl-wrap" }, el("table", null, el("thead", null, el("tr", null, ["Gara", "Data", "Giorni", "Fase", ""].map((h, i) => el("th", { class: i === 2 ? "r" : null, text: h })))),
    el("tbody", null, D.events.map(e => el("tr", null, el("td", null, el("div", { text: e.name }), e.goal ? el("div", { class: "muted", text: e.goal }) : null), el("td", { text: dmy(e.date) }), el("td", { class: "r", text: String(e.days) }), el("td", { text: e.phase }), el("td", null, e.priority ? el("span", { class: "pill", text: e.priority }) : null)))))));
  sec.append(el("div", { class: "grid g2" }, card, ev));
})();

// recent activities
(function recentSection() {
  const sec = sectionHead("recent", "Ultime attività", "«Chiedi al coach» copia una richiesta di analisi da incollare nella chat.");
  app.append(sec);
  const names = Object.fromEntries(SPORTS);
  sec.append(el("div", { class: "card" }, el("div", { class: "tbl-wrap" }, el("table", null,
    el("thead", null, el("tr", null, ["Data", "Attività", "Durata", "Distanza", "Ritmo", "FC", "NP", "Carico", "Deriva", ""].map((h, i) => el("th", { class: i >= 2 && i <= 8 ? "r" : null, text: h })))),
    el("tbody", null, D.recent.map(a => el("tr", null,
      el("td", { class: "num", text: `${dm(a.date)} ${a.time}` }),
      el("td", null, el("span", { style: "display:inline-flex;gap:6px;align-items:center" }, el("i", { class: "key-dot", style: `background:var(--${a.sport})` }), el("span", { text: a.name || a.type })), el("div", { class: "muted", text: `${a.type}${a.te_label ? " · " + a.te_label : ""}` })),
      el("td", { class: "r", text: a.duration }), el("td", { class: "r", text: a.distance || "–" }), el("td", { class: "r", text: a.pace || "–" }),
      el("td", { class: "r", text: a.hr == null ? "–" : String(a.hr) }), el("td", { class: "r", text: a.power == null ? "–" : a.power + " W" }),
      el("td", { class: "r", text: String(a.load) }), el("td", { class: "r", text: a.decoupling == null ? "–" : nf(a.decoupling, 1) + "%" }),
      el("td", null, el("button", { class: "btn", type: "button", text: "Chiedi al coach", onclick: () => copy(`Analizza la mia attività ${a.id} del ${dmy(a.date)} (${a.type}${a.distance ? " " + a.distance : ""}): com'è andata e cosa mi dice sulla forma?`) })))))))));
})();

app.append(el("footer", null,
  el("p", { text: `Generata il ${D.generated} dalla cache locale di garmin-coach, senza connessione. Le metriche sono calcoli locali (vedi docs/METRICS.md e docs/DASHBOARD.md), non i valori proprietari di Garmin (Training Status, Training Readiness). Le tendenze confrontano mediane di uscite comparabili; con poche uscite sono indicate come da confermare.` }),
  el("p", { text: "La pagina si aggiorna da sola dopo ogni sincronizzazione; per rigenerarla a mano: garmin-coach dashboard --open." })));

let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => state.redraw.forEach(f => f()), 150); });
