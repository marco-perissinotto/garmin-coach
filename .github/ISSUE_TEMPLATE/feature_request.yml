name: Feature request
description: Propose a new feature or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that garmin-coach does not allow today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Note which Garmin endpoints it needs (only the 26 documented ones exist).
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: It keeps garmin-coach local, read-only towards Garmin and free of LLM calls in the pipeline (docs/PLAN.md §0).
          required: true
